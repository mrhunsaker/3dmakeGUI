name: Build And Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (for example: v2026.5.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build with PyInstaller
        run: uv run pyinstaller 3dmake_gui.spec

      - name: Package linux artifact
        run: tar -czf 3dmake-gui.tar.gz -C dist 3dmake-gui

      - name: Upload linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: 3dmake-gui.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build with PyInstaller
        run: uv run pyinstaller 3dmake_gui.spec

      - name: Package windows artifact
        shell: pwsh
        run: Compress-Archive -Path dist/3dmake-gui -DestinationPath 3dmake-gui.zip -Force

      - name: Upload windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: 3dmake-gui.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.version }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi

          if [[ "$RAW_TAG" != v* ]]; then
            RAW_TAG="v$RAW_TAG"
          fi

          echo "RELEASE_TAG=$RAW_TAG" >> "$GITHUB_ENV"
          echo "Resolved release tag: $RAW_TAG"

      - name: Ensure release tag exists
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
          else
            echo "Tag $RELEASE_TAG not found; creating it at $GITHUB_SHA"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Download linux archive
        uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: release-assets

      - name: Download windows archive
        uses: actions/download-artifact@v4
        with:
          name: windows-archive
          path: release-assets

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
